<svg xmlns="http://www.w3.org/2000/svg" width="860" height="104" viewBox="0 0 860 104" role="img" aria-label="Open to work: freelance or full-time, based in Lyon, open to relocation">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #dafbe1; stroke: #1a7f37; }
    .title { font-size: 24px; font-weight: 700; fill: #1a7f37; }
    .body { font-size: 15px; fill: #1f2328; }
    .strong { font-weight: 600; }
    .dot { fill: #1a7f37; }
    .halo { fill: #1a7f37; opacity: .25; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #12261e; stroke: #238636; }
      .title { fill: #3fb950; }
      .body { fill: #e6edf3; }
      .dot { fill: #3fb950; }
      .halo { fill: #3fb950; }
    }
  </style>
  <rect class="card" x="1" y="1" width="858" height="102" rx="12" stroke-width="1.5" />
  <circle class="halo" cx="38" cy="38" r="12">
    <animate attributeName="r" values="7;13;7" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values=".45;0;.45" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle class="dot" cx="38" cy="38" r="7" />
  <text class="title" x="58" y="46">Open to work</text>
  <text class="body" x="30" y="78">Looking for my next opportunity, <tspan class="strong">freelance or full-time</tspan> · Based in <tspan class="strong">Lyon</tspan> · <tspan class="strong">Open to relocation</tspan></text>
</svg>

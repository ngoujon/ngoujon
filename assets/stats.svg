<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120" role="img" aria-label="448 contributions, 2 j série en cours, 40 jours actifs, TypeScript langage principal">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tile { fill: #f6f8fa; stroke: #d0d7de; }
    .value { font-size: 30px; font-weight: 700; fill: #1f2328; }
    .label { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 12px; fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #161b22; stroke: #30363d; }
      .value, .label { fill: #e6edf3; }
      .sub { fill: #8d96a0; }
    }
  </style>
  <g>
    <rect class="tile" x="0.5" y="0.5" width="205" height="119" rx="12" />
    <text class="value" x="103" y="52" text-anchor="middle">448</text>
    <text class="label" x="103" y="78" text-anchor="middle">contributions</text>
    <text class="sub" x="103" y="98" text-anchor="middle">sur 12 mois</text>
  </g>
  <g>
    <rect class="tile" x="218.5" y="0.5" width="205" height="119" rx="12" />
    <text class="value" x="321" y="52" text-anchor="middle">2 j</text>
    <text class="label" x="321" y="78" text-anchor="middle">série en cours</text>
    <text class="sub" x="321" y="98" text-anchor="middle">jours d'affilée</text>
  </g>
  <g>
    <rect class="tile" x="436.5" y="0.5" width="205" height="119" rx="12" />
    <text class="value" x="539" y="52" text-anchor="middle">40</text>
    <text class="label" x="539" y="78" text-anchor="middle">jours actifs</text>
    <text class="sub" x="539" y="98" text-anchor="middle">sur 12 mois</text>
  </g>
  <g>
    <rect class="tile" x="654.5" y="0.5" width="205" height="119" rx="12" />
    <text class="value" x="757" y="52" text-anchor="middle">TypeScript</text>
    <text class="label" x="757" y="78" text-anchor="middle">langage principal</text>
    <text class="sub" x="757" y="98" text-anchor="middle"><tspan fill="#3178c6">● </tspan>47 % du code</text>
  </g>
</svg>
